# API + contracts checks on every push to main. Railway's "Wait for CI" uses
# this, so a commit that fails here is never migrated into or deployed to
# staging. No secrets and no database: unit and e2e tests only (the live
# integration suite needs the local Supabase stack).
name: api

on:
  push:
    branches: [main]
    paths: ['apps/api/**', 'packages/contracts/**', 'pnpm-lock.yaml', '.github/workflows/api.yml']
  workflow_dispatch:

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @voya/api...
      - run: pnpm --filter @voya/contracts build
      - run: pnpm --filter @voya/api db:generate
      - run: pnpm --filter @voya/contracts --filter @voya/api typecheck
      - run: pnpm --filter @voya/contracts --filter @voya/api lint
      - run: pnpm --filter @voya/contracts --filter @voya/api test
      - name: Production image builds
        run: docker build -f apps/api/Dockerfile -t voya-api:ci .
